[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "reqlens"
version = "0.1.0"  # keep in sync with reqlens/__init__.py (enforced by a test)
description = "Passive HTTP capture analyzer for authorized web-application security testing."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]
ai = ["anthropic"]  # only for --ai-provider anthropic; the other providers need nothing extra

[project.scripts]
reqlens = "reqlens.cli:main"

[tool.setuptools.packages.find]
include = ["reqlens*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "allow_network: test may open local sockets (mock AI servers only; never a target)",
]
